# Publication Collaboration Network
#
# HOW TO UPDATE THIS GRAPH
# ------------------------
# 1. Add one entry per publication under `publications`.
# 2. Keep each author's display name identical across every entry. Exact names are
#    used as stable identifiers, so "SooHyuk Cho" and "Soohyuk Cho" would be
#    treated as different people.
# 3. List each author only once per publication. Author order does not change the
#    graph: node weight is the number of publications and edge weight is the
#    number of publications shared by each pair of authors.
# 4. Set `focus_person` to the person who should appear at the center.
#
# This file is intentionally separate from `_data/publications.yml`: that file's
# author strings contain presentation HTML and contribution markers, while this
# graph needs plain, normalized names.

